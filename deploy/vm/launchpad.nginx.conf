# REPOSITORY CANDIDATE ONLY. Do not install or reload without explicit approval.
# FUTURE CUTOVER: replace the older assistant only at lesliec.ccaurora.edu,
# serving Launchpad at /. The enabled old vhost currently claims this name;
# archive it first and remove only lesliec from BOTH old server_name directives
# in the approved maintenance window before enabling this candidate.
# Preserve itsupport.ccaurora.edu and its upstream unless separately retired.
# No duplicate server_name, old-backend restart, or default_server is intended.
# Included at nginx's http{} level, after review on the installed nginx version.
# Existing certificate filenames are referenced only; no certificate/key copied.
# The current wildcard expiry (October 28, 2026) is verified. These paths are
# conditional on owner remediation of readable key-bearing copies, approved
# replacement/renewal and direct key matching; do not reuse the files as-is.

log_format launchpad_minimal '$time_iso8601 $request_method $status $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name lesliec.ccaurora.edu;
    access_log /var/log/nginx/launchpad.access.log launchpad_minimal;
    error_log /dev/null crit;
    # The authority is fixed: an untrusted Host cannot choose the redirect target.
    return 308 https://lesliec.ccaurora.edu$request_uri;
}

server {
    # nginx 1.24 syntax; this is not a new default_server for the shared VM.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lesliec.ccaurora.edu;

    ssl_certificate /opt/project/certs/fullchain.pem;
    ssl_certificate_key /opt/project/certs/ccaurora.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:launchpad_tls:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Reject a foreign Host even when its TLS SNI selected this vhost.
    if ($host != lesliec.ccaurora.edu) { return 421; }

    access_log /var/log/nginx/launchpad.access.log launchpad_minimal;
    # Even crit-level nginx connection errors can contain callback codes in
    # request URLs. nginx cannot give error records a redacted custom format:
    # discard this vhost's raw error lines and monitor sanitized access 5xx
    # status/duration plus the application's safe journal. Do not enable raw
    # request/error logging while real sign-in or learner traffic is allowed.
    error_log /dev/null crit;
    server_tokens off;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 15s;
    send_timeout 30s;

    location / {
        proxy_pass http://unix:/run/launchpad/gunicorn.sock;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host lesliec.ccaurora.edu;
        # Unix-socket peers are trusted by Gunicorn. Overwrite/clear these
        # values here; do not pass client-supplied forwarding/scheme/path claims.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header SCRIPT_NAME "";
        proxy_set_header PATH_INFO "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 35s;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_redirect off;
    }
}
