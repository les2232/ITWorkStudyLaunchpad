# Closed-access rollback for only lesliec; mutually exclusive with its app vhost.
# Same approved current certificate and required key containment as the app site.
server {
    listen 80;
    listen [::]:80;
    server_name lesliec.ccaurora.edu;
    access_log off;
    error_log /dev/null crit;
    return 308 https://lesliec.ccaurora.edu$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lesliec.ccaurora.edu;
    ssl_certificate /opt/project/certs/fullchain.pem;
    ssl_certificate_key /opt/project/certs/ccaurora.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    if ($host != lesliec.ccaurora.edu) { return 421; }
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "300" always;
    return 503 "Launchpad controlled test is closed. Please contact the facilitator.\n";
}
