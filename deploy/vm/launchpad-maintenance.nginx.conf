# Closed-access rollback for lesliec only; mutually exclusive with the app vhost.
# Enable by replacing the sites-enabled/launchpad link; leave other sites alone.
server {
    listen 80;
    listen [::]:80;
    server_name lesliec.ccaurora.edu;
    access_log off;
    error_log /dev/null crit;
    return 308 https://lesliec.ccaurora.edu$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lesliec.ccaurora.edu;
    ssl_certificate /opt/project/certs/fullchain.pem;
    ssl_certificate_key /opt/project/certs/ccaurora.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    if ($host != lesliec.ccaurora.edu) { return 421; }
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "300" always;
    return 503 "IT Work Study Launchpad is temporarily unavailable for maintenance. Your saved progress is kept. Please try again later or contact your mentor.\n";
}
