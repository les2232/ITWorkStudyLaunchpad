# CONTROLLED TEST CANDIDATE ONLY — no live installation/reload performed.
# Remove only lesliec from BOTH old vhost server_name lists before enabling.
# Never enable alongside the production launchpad.nginx.conf for this hostname.
# Keep itsupport.ccaurora.edu and its current upstream unchanged.
# Owner approved the current front-end certificate until renewal (2026-10-09).
# Restrict every identified key-bearing copy and verify key matching before use.
# App key is separate, operator-private; Nginx gets only its public backend CA.
# Backend certificate SAN: launchpad-controlled.invalid (no DNS entry needed).
# See docs/vm_deployment.md, Controlled browser test routing, before installation.

log_format launchpad_controlled_minimal '$time_iso8601 $request_method $status $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name lesliec.ccaurora.edu;
    access_log /var/log/nginx/launchpad-controlled.access.log launchpad_controlled_minimal;
    error_log /dev/null crit;
    # The authority is fixed: an untrusted Host cannot choose the redirect target.
    return 308 https://lesliec.ccaurora.edu$request_uri;
}

server {
    # nginx 1.24 syntax; this is not a new default_server for the shared VM.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lesliec.ccaurora.edu;

    ssl_certificate /opt/project/certs/fullchain.pem;
    ssl_certificate_key /opt/project/certs/ccaurora.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:launchpad_controlled_tls:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Reject a foreign Host even when its TLS SNI selected this vhost.
    if ($host != lesliec.ccaurora.edu) { return 421; }

    access_log /var/log/nginx/launchpad-controlled.access.log launchpad_controlled_minimal;
    # Even crit-level nginx connection errors can contain callback codes in
    # request URLs. nginx cannot give error records a redacted custom format:
    # discard this vhost's raw error lines and monitor sanitized access 5xx
    # status/duration plus the application's safe journal. Do not enable raw
    # request/error logging while real sign-in or learner traffic is allowed.
    error_log /dev/null crit;
    server_tokens off;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 15s;
    send_timeout 30s;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 1;
        proxy_ssl_server_name on;
        proxy_ssl_name launchpad-controlled.invalid;
        proxy_ssl_trusted_certificate /etc/nginx/launchpad-controlled/backend-ca.pem;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        # Do not retry sign-in submissions or fall back to another upstream.
        proxy_next_upstream off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host lesliec.ccaurora.edu;
        # The controlled launcher derives HTTPS from actual backend TLS and
        # disables forwarded-scheme trust. Still remove all client claims.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header SCRIPT_NAME "";
        proxy_set_header PATH_INFO "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 35s;
        # Keep credential-bearing request bodies out of nginx temporary files.
        proxy_request_buffering off;
        proxy_buffering on;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_redirect off;
    }
}
